[package]
name = "av-sandbox"
version = "1.0.0"
edition = "2021"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1.6", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

reqwest = { version = "0.11", features = ["json"] }

[dev-dependencies]
tempfile = "3.8"

[features]
default = []

[[bin]]
name = "av-sandbox"
path = "src/main.rs"
