name: Build Cross-Platform Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: av-ui-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: av-ui-desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend deps
        run: npm ci
      - name: Build Tauri (Windows)
        run: npm run tauri build
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-builds
          path: |
            av-ui-desktop/src-tauri/target/release/bundle/**/*.exe
            av-ui-desktop/src-tauri/target/release/bundle/**/*.msi

  build-linux:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: av-ui-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: av-ui-desktop/package-lock.json
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend deps
        run: npm ci
      - name: Build Tauri (Linux)
        run: npm run tauri build
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-builds
          path: |
            av-ui-desktop/src-tauri/target/release/bundle/**/*.AppImage
            av-ui-desktop/src-tauri/target/release/bundle/**/*.deb
            av-ui-desktop/src-tauri/target/release/bundle/**/*.rpm

  build-macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: av-ui-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: av-ui-desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Install frontend deps
        run: npm ci
      - name: Build Tauri (macOS universal)
        run: npm run tauri build -- --target universal-apple-darwin
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-builds
          path: |
            av-ui-desktop/src-tauri/target/release/bundle/**/*.app
            av-ui-desktop/src-tauri/target/release/bundle/**/*.dmg

  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: av-ui-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: av-ui-desktop/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - name: Install NDK
        run: sdkmanager "ndk;25.2.9519653"
      - name: Install frontend deps
        run: npm ci
      - name: Init Android project
        run: npm run tauri android init
      - name: Build Android APK
        run: npm run tauri android build --apk
      - name: Build Android AAB
        run: npm run tauri android build
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: |
            av-ui-desktop/src-tauri/gen/android/app/build/outputs/apk/release/*.apk
            av-ui-desktop/src-tauri/gen/android/app/build/outputs/bundle/release/*.aab

  build-ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: av-ui-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: av-ui-desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios
      - name: Install frontend deps
        run: npm ci
      - name: Init iOS project
        run: npm run tauri ios init
      - name: Build iOS IPA
        run: npm run tauri ios build -- --export-method ad-hoc
      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-builds
          path: av-ui-desktop/src-tauri/gen/ios/build/*.ipa
