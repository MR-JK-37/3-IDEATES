[workspace]
members = [
    "av-service",
    "av-sandbox",
    "av-ai",
    "av-ui-desktop/src-tauri"
]

resolver = "2"

[workspace.dependencies]
tokio = { version = "1.35", features = ["full"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
