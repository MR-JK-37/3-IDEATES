<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CyberDefense Dashboard Preview</title>
  <style>
    body{background:#0f0f0f;color:#fff;font-family:Inter,system-ui,Arial;padding:20px}
    .container{max-width:900px;margin:0 auto}
    .status{background:#1a1a1a;padding:16px;border-radius:12px;border-left:4px solid #51CF66;margin-bottom:18px}
    .status h2{margin:0 0 8px 0}
    .row{display:flex;gap:12px;margin-bottom:18px}
    .card{flex:1;padding:16px;border-radius:12px;background:#1a1a1a}
    .card.critical{background:#2b0e0e}
    .summary{display:flex;gap:12px}
    .summary .item{flex:1;padding:16px;border-radius:12px;color:#fff}
    .item.critical{background:#FF6B6B}
    .item.high{background:#FF9F43}
    .item.total{background:#51CF66}
    .threat{border-left:4px solid #444;padding:12px;border-radius:8px;background:#151515;margin-bottom:10px}
    .threat .meta{display:flex;justify-content:space-between;color:#999;font-size:12px}
    .threat .details{color:#ccc;margin-top:6px}
    .empty{color:#51CF66;padding:24px;text-align:center}
    .footer{color:#666;font-size:13px;margin-top:18px}
  </style>
</head>
<body>
  <div class="container">
    <div class="status">
      <h2>System Status</h2>
      <div class="meta">
        <div>Monitoring: <strong style="color:#51CF66">🟢 Active</strong></div>
        <div id="osVersion">OS: unknown</div>
      </div>
    </div>

    <div class="summary">
      <div class="item critical">
        <div style="font-size:28px;font-weight:700" id="criticalCount">0</div>
        <div>Critical</div>
      </div>
      <div class="item high">
        <div style="font-size:28px;font-weight:700" id="highCount">0</div>
        <div>High Risk</div>
      </div>
      <div class="item total">
        <div style="font-size:28px;font-weight:700" id="totalCount">0</div>
        <div>Total</div>
      </div>
    </div>

    <h3 style="margin-top:20px">Recent Threats</h3>
    <div id="threatList">
      <div class="empty">Loading threats…</div>
    </div>

    <div class="footer">Preview generated from <strong>DashboardScreen.tsx</strong>. Open this file locally to see a static mock.</div>
  </div>

  <script>
    // Mock data (replace or extend as needed)
    const mockThreats = [
      { id: 't1', timestamp: Date.now()-60000, type: 'file', severity: 'critical', source: 'encryptor', details: 'Mass file write detected: /home/user/Documents/report.docx (Entropy: 7.98)' },
      { id: 't2', timestamp: Date.now()-120000, type: 'process', severity: 'high', source: 'suspicious.exe', details: 'Unsigned executable executed from Downloads' },
      { id: 't3', timestamp: Date.now()-360000, type: 'network', severity: 'medium', source: 'com.browser', details: 'Unusual outbound connection to 45.33.21.10:443 (possible C2)' },
      { id: 't4', timestamp: Date.now()-720000, type: 'file', severity: 'low', source: 'updater', details: 'Update file downloaded: /var/tmp/update.bin (low risk)' }
    ];

    function fmtTime(ts){ const d=new Date(ts); return d.toLocaleTimeString() }

    function render(){
      const list = document.getElementById('threatList');
      list.innerHTML = '';
      if(!mockThreats.length){ list.innerHTML = '<div class="empty">✅ No threats detected</div>'; return }

      const criticalCount = mockThreats.filter(t=>t.severity==='critical').length;
      const highCount = mockThreats.filter(t=>t.severity==='high').length;
      const totalCount = mockThreats.length;
      document.getElementById('criticalCount').textContent = criticalCount;
      document.getElementById('highCount').textContent = highCount;
      document.getElementById('totalCount').textContent = totalCount;
      document.getElementById('osVersion').textContent = 'OS: Linux (preview)';

      mockThreats.forEach(t=>{
        const el = document.createElement('div');
        el.className = 'threat';
        el.innerHTML = `
          <div class="meta"><div>${t.type.toUpperCase()}</div><div style=\"color:${t.severity==='critical'? '#FF6B6B': t.severity==='high'? '#FF9F43':'#FFD93D'}\">${t.severity}</div></div>
          <div style=\"font-weight:600;color:#fff;margin-top:6px\">${t.source}</div>
          <div class="details">${t.details}</div>
          <div class="meta" style=\"margin-top:8px\"><div style=\"color:#666\">${fmtTime(t.timestamp)}</div><div style=\"color:#999\">ID: ${t.id}</div></div>
        `;
        list.appendChild(el);
      })
    }

    render();
  </script>
</body>
</html>
